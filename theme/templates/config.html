<form>
  <div class="form-group">
    <label for="express-app-name">App name</label>
    <input class="form-control" id="express-app-name" name="app_name" type="text" placeholder="Challenge Express">
    <small class="form-text text-muted">Used in window titles, the login prompt, taskbar, and help. Leave blank for Challenge Express.</small>
  </div>
  <div class="form-group">
    <label for="express-logo">Logo URL</label>
    <input class="form-control" id="express-logo" name="logo" type="text" placeholder="/files/your-logo.png">
    <small class="form-text text-muted">Use an uploaded file path or HTTPS image URL. Shown in the login prompt and window title bar. Leave blank for the original icons.</small>
  </div>
  <button type="submit" class="btn btn-primary float-right mt-4">Update</button>
</form>
